<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" role="img" aria-label="Kylin Trading">
  <title>Kylin Trading</title>
  <!--
    Placeholder lockup — geometric qilin seal + wordmark.
    Replace this file with the final PNG or SVG when the brand mark is ready.
    Palette: teal #0B3D3A · gold #C4A35A · cream #F7F4EE
    Suggested PNG: transparent, ~900×200px, this aspect ratio.
  -->
  <defs>
    <style>
      .ring { fill: none; stroke: #C4A35A; }
      .line { fill: none; stroke: #C4A35A; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Seal field -->
  <circle cx="40" cy="40" r="39" fill="#0B3D3A"/>
  <circle cx="40" cy="40" r="37.4" class="ring" stroke-width="1.15"/>
  <circle cx="40" cy="40" r="33.6" class="ring" stroke-width="0.35" opacity="0.75"/>

  <!-- Geometric qilin: line-art, seated, facing east -->
  <g class="line" transform="translate(40 40) scale(0.92) translate(-40 -42)">
    <!-- Horn -->
    <path d="M58 28 C60 18, 58 10, 52 6" stroke-width="1.7"/>
    <path d="M58 28 C56 20, 54 14, 52 10" stroke-width="1.05"/>
    <!-- Head + snout -->
    <path d="M48 32 C50 27, 56 26, 62 28 C68 30, 72 34, 70 38 C68 41, 62 42, 58 40 C54 38, 50 36, 48 32Z" stroke-width="1.55"/>
    <!-- Eye -->
    <circle cx="62" cy="33.5" r="1.15" fill="#C4A35A" stroke="none"/>
    <!-- Ear -->
    <path d="M54 28 C53 24, 55 22, 57 24" stroke-width="1.2"/>
    <!-- Neck into chest -->
    <path d="M50 38 C46 44, 42 50, 40 56" stroke-width="1.55"/>
    <!-- Back line + haunch -->
    <path d="M48 34 C40 36, 30 40, 26 48 C22 56, 26 64, 34 66 C42 68, 48 64, 50 58" stroke-width="1.55"/>
    <!-- Belly -->
    <path d="M40 56 C36 58, 34 60, 34 64" stroke-width="1.3"/>
    <!-- Front leg (folded, seated) -->
    <path d="M50 58 C52 62, 54 66, 52 70" stroke-width="1.4"/>
    <path d="M52 70 C56 70, 58 68, 58 66" stroke-width="1.15"/>
    <!-- Hind leg -->
    <path d="M34 66 C32 70, 30 73, 28 74" stroke-width="1.4"/>
    <path d="M28 74 C32 75, 35 73, 36 70" stroke-width="1.15"/>
    <!-- Mane — three ruyi / flame strokes -->
    <path d="M46 30 C40 26, 34 20, 34 14" stroke-width="1.35"/>
    <path d="M42 34 C34 32, 26 28, 24 22" stroke-width="1.25"/>
    <path d="M38 38 C30 38, 22 36, 18 32" stroke-width="1.15"/>
    <!-- Chest scales -->
    <path d="M44 48 C46 49.2, 48 49.2, 50 48" stroke-width="0.9"/>
    <path d="M43 51.5 C45 52.7, 47 52.7, 49 51.5" stroke-width="0.9"/>
    <!-- Tail flame -->
    <path d="M26 50 C18 48, 12 50, 10 56 C14 52, 20 52, 26 54" stroke-width="1.2"/>
  </g>

  <!-- Wordmark -->
  <g fill="#0B3D3A">
    <text x="96" y="44"
      font-family="Georgia, 'Palatino Linotype', 'Times New Roman', serif"
      font-size="34"
      font-weight="500"
      letter-spacing="4">KYLIN</text>
    <text x="99" y="64"
      font-family="Georgia, 'Palatino Linotype', 'Times New Roman', serif"
      font-size="10.5"
      font-weight="400"
      letter-spacing="7.6">TRADING</text>
  </g>
  <line x1="96" y1="50" x2="248" y2="50" stroke="#C4A35A" stroke-width="0.65"/>
</svg>
